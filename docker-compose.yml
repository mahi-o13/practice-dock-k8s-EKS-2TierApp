services:

  mysql:
    image: mysql:8
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: mydb

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

    networks:
      - twotier

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flask-app:
    image: maheshshillare/two-tier-flask-app:latest
    container_name: flask-app

    ports:
      - "5000:5000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: admin
      MYSQL_DB: mydb

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - twotier

networks:
  twotier:

volumes:
  mysql-data:
